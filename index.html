<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrie 4.0 AR Mockup</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    /* Видеопоток с камеры на весь экран */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* Верхняя панель статуса */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px 15px;
      background: rgba(0, 0, 0, 0.75);
      border-bottom: 2px solid #00ff66;
      color: #fff;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }

    /* Оверлей-дашборд внизу экрана */
    #overlay {
      position: fixed;
      bottom: 30px;
      left: 20px;
      right: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #00ff66;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      z-index: 10;
    }

    .title { color: #00ff66; font-weight: bold; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; margin: 5px 0; }
    
    /* Шаги процесса */
    .steps { display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; font-size: 11px; }
    .step { color: #555; }
    .step.active { color: #00ff66; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Поток камеры -->
  <video id="webcam" autoplay playsinline></video>

  <!-- Верхний статус -->
  <div class="top-bar">
    <div><strong>CPS-i40</strong> Monitor</div>
    <div style="color: #00ff66;">🔒 HTTPS Secure</div>
  </div>

  <!-- Дашборд данных -->
  <div id="overlay">
    <div class="title">Anlage: CPS-i40 Befüllstation</div>
    <div class="row"><span>SPS Status:</span><span style="color:#00ff66;">Siemens S7-1516 (Online)</span></div>
    <div class="row"><span>Füllstand:</span><span id="val-fill">0%</span></div>
    <div class="row"><span>Ventil-Aktion:</span><span id="val-valve">Warten...</span></div>

    <div class="steps">
      <span class="step" id="s1">1. Sensor</span>
      <span class="step" id="s2">2. ET200SP</span>
      <span class="step" id="s3">3. SPS</span>
      <span class="step" id="s4">4. Ventil</span>
      <span class="step" id="s5">5. Full</span>
    </div>
  </div>

  <script>
    // 1. Запуск камеры без тяжелых библиотек
    const video = document.getElementById('webcam');
    
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment' }, 
        audio: false 
      })
      .then((stream) => {
        video.srcObject = stream;
      })
      .catch((err) => {
        console.error("Fehler beim Kamerazugriff: ", err);
        alert("Пожалуйста, разрешите доступ к камере в настройках браузера.");
      });
    }

    // 2. Простая циклическая симуляция данных из схемы
    const valFill = document.getElementById('val-fill');
    const valValve = document.getElementById('val-valve');
    let volume = 0;

    function setSteps(count) {
      for(let i=1; i<=5; i++) {
        document.getElementById('s'+i).classList.toggle('active', i <= count);
      }
    }

    setInterval(() => {
      volume += 20;
      if (volume > 100) volume = 0;

      if (volume === 0) {
        valFill.innerHTML = '0% (<span style="color:#ffcc00">Dose leer</span>)';
        valValve.innerText = 'Befüllung startet...';
        setSteps(2);
      } else if (volume < 100) {
        valFill.innerText = volume + '%';
        valValve.innerHTML = '<span style="color:#00ff66">Befüllung läuft</span>';
        setSteps(4);
      } else {
        valFill.innerHTML = '100% (<span style="color:#00ff66">Dose voll</span>)';
        valValve.innerHTML = '<span style="color:#ff3333">Gestoppt (Rückmeldung)</span>';
        setSteps(5);
      }
    }, 1500);
  </script>
</body>
</html>
