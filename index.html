<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Industrie 4.0 AR - PowerHouse P-101</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; overflow: hidden; }

    /* ---------- Fenster nach Marker-Erkennung ---------- */
    #overlay {
      display: none;
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10;
      width: min(92vw, 360px);
      box-sizing: border-box;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-top: 3px solid #2ecc71;
      border-radius: 14px;
      background: rgba(16, 18, 22, 0.72);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      font-size: 15px;
      color: #fff;
    }
    #overlay.warn    { border-top-color: #f1c40f; }
    #overlay.alarm   { border-top-color: #ff5a4f; box-shadow: 0 0 18px rgba(255, 90, 79, 0.45); }
    #overlay.ausfall { border-top-color: #95a5a6; }

    .title { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 16px; }
    .title small { font-weight: 400; font-size: 12px; opacity: 0.7; }
    .big { font-size: 34px; font-weight: 800; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
    .big span { font-size: 14px; font-weight: 400; opacity: 0.6; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .stats div { background: rgba(255, 255, 255, 0.07); border-radius: 8px; padding: 5px 8px; }
    .stats label { display: block; font-size: 10px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
    .stats b { font-variant-numeric: tabular-nums; }

    .row { display: flex; justify-content: space-between; gap: 16px; margin: 3px 0; }
    .row span { opacity: 0.75; }
    .small { font-size: 12px; opacity: 0.6; margin-top: 6px; }
    .red    { color: #ff6b5b; }
    .green  { color: #5cd65c; }
    .yellow { color: #f1c40f; }
    .grey   { color: #bdc3c7; }

    /* ---------- MQTT-Anzeige oben links ---------- */
    #conn {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top));
      left: 8px;
      z-index: 11;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 12px;
    }

    /* ---------- Kamera-/Canvas-Darstellung ---------- */
    video, canvas {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
    }
  </style>
</head>
<body>
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    embedded
    arjs="sourceType: webcam; facingMode: environment; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
    <a-marker preset="hiro" id="hiro-marker">
      <!-- Säule: Höhe = Vibrationswert, Farbe = Zustand -->
      <a-box id="ar-box" position="0 0.25 0" width="0.5" depth="0.5" height="0.5" color="#27ae60" opacity="0.85"></a-box>
      <!-- Text flach auf dem Marker -->
      <a-text id="ar-text" value="warte..." position="0 0.05 0.9" rotation="-90 0 0" align="center" width="4" color="#ffffff"></a-text>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <div id="conn">MQTT: verbinde…</div>

  <div id="overlay">
    <div class="title">PowerHouse P-101 <small id="ov-trend"></small></div>
    <div class="big" id="ov-value">– <span>mm/s</span></div>
    <div class="stats">
      <div><label>Ø 5 min</label><b id="ov-avg">–</b></div>
      <div><label>Min</label><b id="ov-min">–</b></div>
      <div><label>Max</label><b id="ov-max">–</b></div>
    </div>
    <div class="row"><span>Zustand</span><b id="ov-op">–</b></div>
    <div class="row"><span>Alarm</span><b id="ov-alarm">–</b></div>
    <div class="row"><span>Datenquelle</span><b id="ov-status">–</b></div>
    <div class="small" id="ov-time">warte auf Daten…</div>
    <div class="small" id="marker-count">The Marker was not yet found</div>
  </div>

  <script>
    // ---------- Konfiguration ----------
    const BASE      = '/bbk-lf7/23/power-house/vibration';
    const BROKER    = 'wss://broker.hivemq.com:8884/mqtt';
    const ALARM_T   = 6.0;              // wie im Node-RED-Flow
    const WARN_T    = 4.0;              // ab hier "erhöht"
    const WINDOW_MS = 5 * 60 * 1000;    // Statistik über 5 Minuten
    const STALE_MS  = 15 * 1000;        // 15 s ohne Wert = keine Daten

    // ---------- Elemente ----------
    const $ = id => document.getElementById(id);
    const overlay     = $('overlay');
    const hiroMarker  = $('hiro-marker');
    const markerCount = $('marker-count');
    const conn        = $('conn');
    const arBox       = $('ar-box');
    const arText      = $('ar-text');

    // ---------- Zustand ----------
    const state = { value: null, ts: null, alarm: null, alarmCount: 0, alarmTs: null, status: null, history: [] };
    let markerFoundCount = 0;

    const fmt   = v => (v == null || isNaN(v)) ? '–' : v.toFixed(2).replace('.', ',');
    const mean  = a => a.reduce((s, x) => s + x, 0) / a.length;
    const time  = ts => new Date(ts).toLocaleTimeString('de-DE');
    const stale = () => !state.ts || Date.now() - state.ts > STALE_MS;

    function opState(v) {
      if (v == null) return '–';
      if (v < 0.3)     return 'Stillstand';
      if (v < WARN_T)  return 'Normal';
      if (v < ALARM_T) return 'Erhöht';
      return 'Kritisch';
    }

    function setText(id, text, cls) {
      const el = $(id);
      el.textContent = text;
      el.className = cls || '';
    }

    // ---------- Darstellung ----------
    function render() {
      const vals = state.history.map(p => p.v);

      // Hauptwert
      $('ov-value').innerHTML = fmt(state.value) + ' <span>mm/s</span>';

      // Statistik der letzten 5 Minuten
      $('ov-avg').textContent = vals.length ? fmt(mean(vals))      : '–';
      $('ov-min').textContent = vals.length ? fmt(Math.min(...vals)) : '–';
      $('ov-max').textContent = vals.length ? fmt(Math.max(...vals)) : '–';

      // Trend: letzte 5 Werte vs. die 5 davor
      let trend = '';
      if (vals.length >= 10) {
        const d = mean(vals.slice(-5)) - mean(vals.slice(-10, -5));
        trend = d > 0.15 ? '↑ steigend' : d < -0.15 ? '↓ fallend' : '→ stabil';
      }
      $('ov-trend').textContent = trend;

      // Betriebszustand
      const op = stale() ? '–' : opState(state.value);
      const opCls = { 'Stillstand': 'grey', 'Normal': 'green', 'Erhöht': 'yellow', 'Kritisch': 'red' }[op];
      setText('ov-op', op, opCls);

      // Alarm (aus Node-RED, Topic …/alarm)
      const alarmInfo = state.alarmCount ? ' (' + state.alarmCount + '×)' : '';
      if (state.alarm === 'alarm')   setText('ov-alarm', 'ALARM' + alarmInfo, 'red');
      else if (state.alarm === 'ok') setText('ov-alarm', 'OK' + alarmInfo, 'green');
      else                           setText('ov-alarm', '–');

      // Datenquelle (aus Node-RED, Topic …/status)
      if (state.status === 'ausfall') setText('ov-status', 'AUSFALL', 'grey');
      else if (stale())               setText('ov-status', 'keine Daten', 'yellow');
      else if (state.status === 'online' || state.ts) setText('ov-status', 'verfügbar', 'green');
      else                            setText('ov-status', '–');

      // Zeit
      let t = state.ts ? 'Letzter Wert: ' + time(state.ts) : 'warte auf Daten…';
      if (state.alarmTs) t += ' · letzter Alarm: ' + time(state.alarmTs);
      $('ov-time').textContent = t;

      // Rahmenfarbe des Fensters
      overlay.classList.remove('warn', 'alarm', 'ausfall');
      if (state.status === 'ausfall' || stale())             overlay.classList.add('ausfall');
      else if (state.alarm === 'alarm')                      overlay.classList.add('alarm');
      else if (state.value != null && state.value >= WARN_T) overlay.classList.add('warn');

      // ---------- AR-Objekte ----------
      let color = '#27ae60';                                       // grün = normal
      if (state.value != null && state.value >= WARN_T) color = '#f1c40f'; // gelb = erhöht
      if (state.alarm === 'alarm')                     color = '#e74c3c'; // rot = Alarm
      if (state.status === 'ausfall' || stale())       color = '#7f8c8d'; // grau = keine Daten
      arBox.setAttribute('color', color);

      const h = Math.max(0.1, (state.value || 0) / 5);  // 10 mm/s ≈ 2 Einheiten hoch
      arBox.setAttribute('height', h);
      arBox.setAttribute('position', '0 ' + (h / 2) + ' 0');

      let label = stale() ? 'keine Daten' : fmt(state.value) + ' mm/s';
      if (state.alarm === 'alarm')    label += '  ALARM';
      if (state.status === 'ausfall') label = 'AUSFALL';
      arText.setAttribute('value', label);
    }

    // ---------- MQTT ----------
    const client = mqtt.connect(BROKER);

    client.on('connect', () => {
      conn.textContent = 'MQTT: verbunden';
      client.subscribe([BASE, BASE + '/alarm', BASE + '/status']);
    });
    client.on('reconnect', () => conn.textContent = 'MQTT: verbinde neu…');
    client.on('close',     () => conn.textContent = 'MQTT: getrennt');
    client.on('error', err => conn.textContent = 'MQTT Fehler: ' + err.message);

    client.on('message', (topic, message, packet) => {
      let data;
      try { data = JSON.parse(message.toString()); } catch (e) { data = message.toString(); }

      if (topic === BASE) {
        const v = Number(data);
        if (isNaN(v)) return;
        state.value = v;
        state.ts = Date.now();
        state.history.push({ ts: state.ts, v });
        state.history = state.history.filter(p => state.ts - p.ts <= WINDOW_MS);
      } else if (topic === BASE + '/alarm') {
        state.alarm = data.state;                        // 'alarm' oder 'ok'
        if (data.state === 'alarm' && !packet.retain) {  // gespeicherte Nachricht nicht mitzählen
          state.alarmCount += 1;
          state.alarmTs = data.ts || Date.now();
        }
      } else if (topic === BASE + '/status') {
        state.status = data.state;                       // 'ausfall' oder 'online'
      }
      render();
    });

    // jede Sekunde neu zeichnen (erkennt ausbleibende Werte)
    setInterval(render, 1000);

    // ---------- Marker ----------
    hiroMarker.addEventListener('markerFound', () => {
      console.debug('Marker found');
      markerFoundCount += 1;
      markerCount.textContent = 'Marker gefunden: ' + markerFoundCount + '×';
      overlay.style.display = 'block';
    });

    hiroMarker.addEventListener('markerLost', () => {
      console.debug('Marker lost');
      overlay.style.display = 'none';
    });

    /* global functions for debugging */
    window.fireEventMarkerFound = () => hiroMarker.dispatchEvent(new CustomEvent('markerFound'));
    window.fireEventMarkerLost  = () => hiroMarker.dispatchEvent(new CustomEvent('markerLost'));

    render();
  </script>
</body>
</html>
